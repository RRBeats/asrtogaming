<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ad1fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#39c1ed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" fill="#000000"/>
  <!-- Main star -->
  <path d="M32 8 L36 24 L52 24 L40 34 L44 50 L32 40 L20 50 L24 34 L12 24 L28 24 Z" 
        fill="url(#starGradient)" 
        filter="url(#glow)"
        stroke="#ad1fff" 
        stroke-width="0.5"/>
  <!-- Small twinkling stars -->
  <circle cx="16" cy="16" r="1.5" fill="#39c1ed" opacity="0.8"/>
  <circle cx="48" cy="20" r="1" fill="#ad1fff" opacity="0.7"/>
  <circle cx="20" cy="48" r="1.2" fill="#39c1ed" opacity="0.6"/>
  <circle cx="52" cy="48" r="1" fill="#ad1fff" opacity="0.8"/>
</svg>

